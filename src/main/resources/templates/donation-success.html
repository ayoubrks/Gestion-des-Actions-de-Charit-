<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Don réussi - Renko Charity')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full text-center bg-white p-10 rounded-2xl shadow-xl">
            <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-emerald-100 mb-6">
                <i class="fa-solid fa-check text-4xl text-emerald-600"></i>
            </div>
            
            <h2 class="text-3xl font-extrabold text-gray-900 mb-4">
                Merci pour votre don !
            </h2>
            <p class="text-gray-600 mb-8">
                Votre don de <strong th:text="${amount} + ' €'"></strong> pour l'action "<strong th:text="${action.title}"></strong>" a été traité avec succès.
            </p>
            
            <div class="space-y-4">
                <a href="/explore" class="w-full inline-flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700">
                    Découvrir d'autres actions
                </a>
                <a th:href="@{'/action/' + ${action.id}}" class="w-full inline-flex justify-center py-3 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    Retourner à l'action
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
