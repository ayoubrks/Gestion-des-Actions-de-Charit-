<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav th:fragment="navbar" class="glass fixed w-full z-50 top-0 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-24 items-center">
            <!-- Logo Section -->
            <div class="flex items-center">
                <a href="/" class="flex items-center gap-3 group">
                    <div
                        class="w-12 h-12 rounded-2xl bg-emerald-500 text-white flex items-center justify-center shadow-xl shadow-emerald-100 group-hover:rotate-12 transition-transform duration-500">
                        <i class="fa-solid fa-hands-holding-child text-2xl"></i>
                    </div>
                    <span class="text-2xl font-black tracking-tighter text-gray-900">Renko <span
                            class="text-emerald-500">Charity</span></span>
                </a>
            </div>

            <div class="hidden md:flex items-center space-x-10">
                <!-- Main Nav Links -->
                <div class="flex items-center space-x-8">
                    <a href="/explore"
                        class="text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-emerald-500 transition-colors"
                        th:text="#{nav.explore}">Explorer</a>
                    <a href="/organizations"
                        class="text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-emerald-500 transition-colors"
                        th:text="#{nav.organizations}">Organisations</a>

                    <!-- Quick Admin Dashboard Link -->
                    <a th:if="${#authorization.expression('hasRole(''SUPER_ADMIN'')')}" href="/admin/dashboard"
                        class="text-[10px] font-black uppercase tracking-widest text-blue-600 hover:text-blue-700 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-gauge-high"></i> Dashboard
                    </a>
                </div>

                <!-- Language Switcher -->
                <div class="flex items-center gap-1 p-1 bg-gray-50 rounded-xl border border-gray-100">
                    <a th:href="@{''(lang='fr')}" class="text-[9px] font-black px-3 py-1.5 rounded-lg transition-all"
                        th:classappend="${#locale.language == 'fr' ? 'bg-white shadow-sm text-emerald-600' : 'text-gray-400 hover:text-gray-600'}">FR</a>
                    <a th:href="@{''(lang='ar-u-nu-latn')}"
                        class="text-[9px] font-black px-3 py-1.5 rounded-lg transition-all"
                        th:classappend="${#locale.language == 'ar' ? 'bg-white shadow-sm text-emerald-600' : 'text-gray-400 hover:text-gray-600'}">AR</a>
                </div>

                <!-- Auth Section -->
                <div th:if="${#authorization.expression('isAuthenticated()')}" class="flex items-center">
                    <div class="relative group">
                        <button class="flex items-center gap-4 pl-4 py-2 border-l border-gray-100 group">
                            <div class="text-right hidden lg:block">
                                <p class="text-[10px] font-black text-gray-400 uppercase tracking-tighter"
                                    th:text="${currentUser?.firstName + ' ' + currentUser?.lastName}"></p>
                                <p class="text-xs font-black text-emerald-500"
                                    th:text="${(currentUser?.balance ?: 0.0) + ' €'}"></p>
                            </div>
                            <div
                                class="w-12 h-12 rounded-2xl overflow-hidden border-4 border-white shadow-2xl group-hover:scale-110 transition-all duration-500">
                                <img th:if="${currentUser?.profileImageUrl != null}"
                                    th:src="${currentUser.profileImageUrl}" class="w-full h-full object-cover">
                                <div th:unless="${currentUser?.profileImageUrl != null}"
                                    class="w-full h-full bg-gray-100 flex items-center justify-center text-gray-400">
                                    <i class="fa-solid fa-user-circle text-2xl"></i>
                                </div>
                            </div>
                        </button>

                        <!-- Dropdown -->
                        <div
                            class="absolute right-0 w-64 mt-4 py-4 bg-white rounded-[2rem] shadow-2xl border border-gray-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-500 transform origin-top-right translate-y-2 group-hover:translate-y-0 overflow-hidden">
                            <div class="px-8 py-6 bg-gray-50/50 mb-2">
                                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Votre
                                    Solde</p>
                                <p class="text-2xl font-black text-gray-900"
                                    th:text="${(currentUser?.balance ?: 0.0) + ' €'}"></p>
                            </div>

                            <div class="px-4 space-y-1">
                                <!-- Dashboard Link (High Visibility for Admin) -->
                                <a th:if="${#authorization.expression('hasRole(''SUPER_ADMIN'')')}"
                                    href="/admin/dashboard"
                                    class="flex items-center gap-4 px-6 py-4 text-xs font-black uppercase tracking-widest text-white bg-blue-600 hover:bg-blue-700 rounded-2xl transition-all shadow-lg shadow-blue-100 mb-2">
                                    <i class="fa-solid fa-gauge-high"></i> Dashboard Admin
                                </a>

                                <a href="/profile"
                                    class="flex items-center gap-4 px-6 py-4 text-xs font-black uppercase tracking-widest text-gray-600 hover:bg-emerald-50 hover:text-emerald-600 rounded-2xl transition-all">
                                    <i class="fa-solid fa-user"></i> Mon Profil
                                </a>
                                <a href="/profile/settings"
                                    class="flex items-center gap-4 px-6 py-4 text-xs font-black uppercase tracking-widest text-gray-600 hover:bg-emerald-50 hover:text-emerald-600 rounded-2xl transition-all">
                                    <i class="fa-solid fa-cog"></i> Paramètres
                                </a>

                                <div class="border-t border-gray-50 pt-2 mt-2">
                                    <form th:action="@{/logout}" method="post">
                                        <button type="submit"
                                            class="w-full flex items-center gap-4 px-6 py-4 text-xs font-black uppercase tracking-widest text-red-500 hover:bg-red-50 rounded-2xl transition-all text-left">
                                            <i class="fa-solid fa-power-off"></i> Déconnexion
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:unless="${#authorization.expression('isAuthenticated()')}" class="flex items-center gap-6">
                    <a href="/login"
                        class="text-[10px] font-black uppercase tracking-widest text-gray-900 hover:text-emerald-500 transition-colors"
                        th:text="#{nav.login}">Connexion</a>
                    <a href="/register"
                        class="px-8 py-4 bg-gray-900 hover:bg-black text-white rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-xl shadow-gray-200 transition-all transform hover:-translate-y-1"
                        th:text="#{nav.register}">Rejoindre</a>
                </div>
            </div>
        </div>
    </div>
</nav>

</html>
