<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inscription - Renko Charity')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    <main class="flex-grow flex items-center justify-center pt-32 pb-24 px-4 relative overflow-hidden">
        <!-- Background Orbs -->
        <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-blue-400/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/3 left-1/4 w-96 h-96 bg-emerald-400/10 rounded-full blur-3xl"></div>

        <div class="max-w-lg w-full relative z-10">
            <div class="glass p-10 md:p-12 rounded-[3rem] shadow-2xl border-white/50">
                <div class="text-center mb-10">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500 text-white mb-6 shadow-xl shadow-emerald-200">
                        <i class="fa-solid fa-user-plus text-2xl"></i>
                    </div>
                    <h2 class="text-3xl font-black text-gray-900 tracking-tight">Créer un compte</h2>
                    <p class="mt-3 text-gray-500 font-medium">Rejoignez la révolution de la charité transparente.</p>
                </div>
                
                <div th:if="${param.error == 'email_exists'}" class="mb-6 p-4 bg-red-50 text-red-600 rounded-2xl text-xs font-bold text-center border border-red-100 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i> Cet email est déjà utilisé.
                </div>
                
                <form class="space-y-6" th:action="@{/register}" th:object="${user}" method="POST">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <div class="space-y-5">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2 ml-1">Prénom</label>
                                <input th:field="*{firstName}" type="text" required 
                                       class="w-full px-6 py-4 bg-white/50 border border-gray-100 rounded-2xl focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all placeholder:text-gray-300 shadow-inner" 
                                       placeholder="Jean">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2 ml-1">Nom</label>
                                <input th:field="*{lastName}" type="text" required 
                                       class="w-full px-6 py-4 bg-white/50 border border-gray-100 rounded-2xl focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all placeholder:text-gray-300 shadow-inner" 
                                       placeholder="Dupont">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2 ml-1">Adresse Email</label>
                            <input th:field="*{email}" type="email" required 
                                   class="w-full px-6 py-4 bg-white/50 border border-gray-100 rounded-2xl focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all placeholder:text-gray-300 shadow-inner" 
                                   placeholder="jean.dupont@exemple.com">
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2 ml-1">Mot de passe</label>
                            <input th:field="*{password}" type="password" required 
                                   class="w-full px-6 py-4 bg-white/50 border border-gray-100 rounded-2xl focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition-all placeholder:text-gray-300 shadow-inner" 
                                   placeholder="••••••••">
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full py-5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black text-lg shadow-xl shadow-emerald-200 transition-all transform hover:-translate-y-1 active:scale-95">
                            S'inscrire maintenant
                        </button>
                    </div>
                </form>
                
                <div class="mt-10 text-center">
                    <p class="text-sm text-gray-500">
                        Déjà membre ? <br/>
                        <a href="/login" class="text-emerald-600 font-black hover:underline mt-2 inline-block">Se connecter à votre compte</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
