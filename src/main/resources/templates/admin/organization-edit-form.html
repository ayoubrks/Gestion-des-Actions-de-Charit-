<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier l'Organisation - Renko Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="min-h-screen">
    <nav class="glass sticky top-0 z-50 px-8 py-4 flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-900 rounded-xl flex items-center justify-center">
                <i class="fa-solid fa-bolt text-emerald-500"></i>
            </div>
            <span class="font-black text-xl tracking-tighter">RENKO<span class="text-emerald-500">.</span></span>
        </div>
        <a href="/admin/dashboard" class="text-xs font-bold hover:text-emerald-500 transition-colors uppercase tracking-widest">Retour Dashboard</a>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-12">
        <div class="mb-12">
            <h1 class="text-4xl font-black text-gray-900 tracking-tight mb-2">Modifier <span class="text-emerald-500">Organisation</span></h1>
            <p class="text-gray-500 font-medium">Mettez à jour les informations légales et visuelles de l'organisation.</p>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-xl border border-gray-50 p-10">
            <form th:action="@{/admin/organizations/save}" th:object="${organization}" method="POST" enctype="multipart/form-data" class="space-y-8">
                <input type="hidden" th:field="*{id}">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Nom de l'organisation</label>
                        <input type="text" th:field="*{name}" required
                            class="w-full px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:border-emerald-500 outline-none transition-all font-bold">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Identifiant Fiscal</label>
                        <input type="text" th:field="*{taxId}" required
                            class="w-full px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:border-emerald-500 outline-none transition-all font-bold">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Siège Social</label>
                    <input type="text" th:field="*{legalAddress}" required
                        class="w-full px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:border-emerald-500 outline-none transition-all font-bold">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Responsable Principal</label>
                    <input type="text" th:field="*{mainContact}" required
                        class="w-full px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:border-emerald-500 outline-none transition-all font-bold">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Mission / Description</label>
                    <textarea th:field="*{description}" rows="4"
                        class="w-full px-6 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:border-emerald-500 outline-none transition-all font-medium text-gray-600"></textarea>
                </div>

                <div class="space-y-4">
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Logo de l'organisation</label>
                    <div class="flex items-center gap-6 p-4 bg-gray-50 rounded-2xl border border-gray-100">
                        <div class="w-20 h-20 bg-white rounded-xl overflow-hidden flex items-center justify-center border-4 border-white shadow-md">
                            <img th:if="*{logoUrl}" th:src="*{logoUrl}" class="w-full h-full object-cover">
                            <i th:unless="*{logoUrl}" class="fa-solid fa-building text-gray-300 text-2xl"></i>
                        </div>
                        <div class="flex-grow">
                            <input type="file" name="logoFile" accept="image/*" class="text-xs font-bold text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-black file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
                            <p class="text-[9px] text-gray-400 mt-2">Format supporté : JPG, PNG. Max 2Mo.</p>
                        </div>
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-50">
                    <button type="submit"
                        class="w-full py-5 bg-gray-900 hover:bg-black text-white rounded-[1.5rem] font-black text-sm uppercase tracking-widest transition-all shadow-xl shadow-gray-200">
                        Enregistrer les modifications
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
