<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Paramètres - Renko Charity')}"></head>
<body class="pt-20">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    <main class="max-w-2xl mx-auto px-4 py-12">
        <div class="glass rounded-3xl p-8 md:p-12 shadow-xl">
            <h1 class="text-3xl font-bold text-gray-900 mb-8">Paramètres du compte</h1>
            
            <!-- Profile Picture Section -->
            <div class="mb-10 pb-10 border-b border-gray-100 flex flex-col items-center">
                <div class="relative group">
                    <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-lg bg-gray-100">
                        <img th:if="${user.profileImageUrl != null}" th:src="${user.profileImageUrl}" class="w-full h-full object-cover">
                        <div th:unless="${user.profileImageUrl != null}" class="w-full h-full flex items-center justify-center text-gray-400">
                            <i class="fa-solid fa-user text-5xl"></i>
                        </div>
                    </div>
                </div>
                
                <form th:action="@{/profile/upload-image}" method="POST" enctype="multipart/form-data" class="mt-6 flex flex-col items-center">
                    <label class="cursor-pointer bg-white border border-gray-200 hover:border-emerald-500 hover:text-emerald-500 px-6 py-2 rounded-full text-sm font-bold transition-all shadow-sm">
                        <span>Changer la photo de profil</span>
                        <input type="file" name="profileImage" accept="image/*" class="hidden" onchange="this.form.submit()">
                    </label>
                    <p class="mt-2 text-xs text-gray-400">JPG, PNG ou GIF. Max 5MB.</p>
                </form>
            </div>

            <form class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Prénom</label>
                        <input type="text" th:value="${user.firstName}" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:border-emerald-500 focus:ring-0 transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nom</label>
                        <input type="text" th:value="${user.lastName}" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:border-emerald-500 focus:ring-0 transition-all">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" th:value="${user.email}" disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-500 cursor-not-allowed">
                    <p class="mt-1 text-xs text-gray-400">L'adresse email ne peut pas être modifiée.</p>
                </div>

                <div class="pt-6 border-t border-gray-100">
                    <h3 class="text-lg font-bold text-gray-900 mb-4 text-red-600">Zone de danger</h3>
                    <button type="button" class="text-red-500 hover:text-red-700 font-medium flex items-center gap-2">
                        <i class="fa-solid fa-trash"></i> Supprimer mon compte
                    </button>
                </div>

                <div class="pt-6 flex justify-end gap-4">
                    <a href="/profile" class="px-6 py-3 text-gray-500 font-bold hover:text-gray-700 transition-colors">Annuler</a>
                    <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-emerald-500/30 transition-all transform hover:-translate-y-0.5">
                        Enregistrer les modifications
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
