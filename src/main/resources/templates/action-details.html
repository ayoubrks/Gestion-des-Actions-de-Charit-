<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Détails de l\'action - Renko Charity')}"></head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    
    <main class="flex-grow pt-32 pb-24">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col lg:flex-row gap-12">
                
                <!-- Main Content Area -->
                <div class="lg:w-2/3 space-y-12">
                    <!-- Action Header & Image -->
                    <div class="bg-white rounded-[3rem] overflow-hidden shadow-2xl border border-gray-100 animate-in fade-in slide-in-from-bottom-8 duration-700">
                        <div class="h-80 md:h-[450px] w-full bg-gray-200 relative group">
                            <img th:if="${action.mainImageUrl != null}" th:src="${action.mainImageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-1000" alt="Image">
                            <img th:if="${action.mainImageUrl == null and action.mediaUrls != null and not #lists.isEmpty(action.mediaUrls)}" th:src="${action.mediaUrls[0]}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-1000" alt="Image">
                            <div th:if="${action.mainImageUrl == null and (action.mediaUrls == null or #lists.isEmpty(action.mediaUrls))}" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-emerald-100 to-teal-50">
                                <i class="fa-solid fa-image text-8xl text-emerald-200"></i>
                            </div>
                            <!-- Category Badge -->
                            <div class="absolute top-8 left-8">
                                <span th:text="${action.category}" class="glass px-6 py-2 rounded-full text-xs font-black text-gray-900 shadow-xl border-white/50"></span>
                            </div>
                        </div>
                        
                        <div class="p-10 md:p-14">
                            <div class="flex items-center gap-6 text-xs font-bold text-gray-400 uppercase tracking-widest mb-8">
                                <span class="flex items-center gap-2"><i class="fa-solid fa-calendar text-emerald-500"></i> <span th:text="${#temporals.format(action.date, 'dd MMMM yyyy')}"></span></span>
                                <span class="flex items-center gap-2"><i class="fa-solid fa-location-dot text-emerald-500"></i> <span th:text="${action.location}"></span></span>
                            </div>
                            
                            <h1 th:text="${action.title}" class="text-4xl md:text-5xl font-black text-gray-900 mb-10 leading-[1.2] tracking-tight"></h1>
                            
                            <div class="prose prose-lg max-w-none text-gray-600 leading-relaxed space-y-6">
                                <p th:text="${action.description}"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Gallery / Media (If needed later) -->
                </div>

                <!-- Sticky Sidebar (Donation Panel) -->
                <div class="lg:w-1/3">
                    <div class="sticky top-32 space-y-8 animate-in fade-in slide-in-from-right-8 duration-700 delay-300">
                        <div class="glass p-10 rounded-[3rem] shadow-2xl border-white/50 relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 rounded-full -mr-16 -mt-16"></div>
                            
                            <h3 class="text-xl font-black text-gray-900 mb-8">Soutenir cette cause</h3>
                            
                            <!-- Stats Area -->
                            <div class="mb-10 space-y-6">
                                <div class="flex justify-between items-end mb-2">
                                    <div>
                                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Récoltés</p>
                                        <p class="text-3xl font-black text-emerald-600" th:text="${#numbers.formatDecimal(action.currentAmount ?: 0, 1, 'COMMA', 0, 'POINT')} + ' €'"></p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Objectif</p>
                                        <p class="text-xl font-bold text-gray-900" th:text="${#numbers.formatDecimal(action.targetAmount ?: 0, 1, 'COMMA', 0, 'POINT')} + ' €'"></p>
                                    </div>
                                </div>
                                
                                <div class="w-full bg-gray-100 rounded-full h-3 overflow-hidden shadow-inner">
                                    <div class="bg-gradient-to-r from-emerald-400 to-emerald-600 h-full rounded-full transition-all duration-1000 shadow-lg shadow-emerald-500/20" 
                                         th:style="'width: ' + (${action.targetAmount > 0} ? (${action.currentAmount} / ${action.targetAmount} * 100) : 0) + '%'"></div>
                                </div>

                                <div class="flex items-center gap-2 text-xs font-bold text-emerald-600 bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-100">
                                    <i class="fa-solid fa-users"></i> 156 donateurs ont déjà participé
                                </div>
                            </div>

                            <!-- Error Alert -->
                            <div th:if="${param.error != null and param.error[0] == 'insufficient_funds'}" 
                                 class="mb-8 p-6 bg-red-50 border border-red-100 text-red-600 rounded-3xl flex items-start gap-4">
                                <i class="fa-solid fa-circle-exclamation mt-1 text-xl"></i>
                                <div>
                                    <p class="font-black text-sm uppercase">Fonds insuffisants</p>
                                    <p class="text-xs font-medium mt-1">Veuillez recharger votre portefeuille pour finaliser ce don.</p>
                                    <a href="/profile" class="text-xs font-black underline mt-2 block">Aller au portefeuille</a>
                                </div>
                            </div>

                            <!-- Payment Tabs/Forms -->
                            <div class="space-y-6">
                                <!-- Wallet Donation -->
                                <form action="/donate/checkout" method="POST" class="space-y-4">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input type="hidden" name="actionId" th:value="${action.id}" />
                                    
                                    <div class="relative group">
                                        <span class="absolute left-6 top-1/2 -translate-y-1/2 text-gray-400 font-black">€</span>
                                        <input type="number" name="amount" min="1" step="1" required 
                                               class="w-full pl-12 pr-6 py-5 bg-white border border-gray-100 rounded-2xl focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/5 outline-none transition-all font-black text-xl placeholder:text-gray-200 shadow-inner" 
                                               placeholder="Montant">
                                    </div>
                                    
                                    <button type="submit" class="w-full py-5 bg-gray-900 hover:bg-black text-white rounded-2xl font-black transition-all transform hover:-translate-y-1 active:scale-95 shadow-xl shadow-gray-200 flex items-center justify-center gap-3">
                                        <i class="fa-solid fa-wallet"></i> Donner (Portefeuille)
                                    </button>
                                </form>

                                <div class="flex items-center gap-4 py-2">
                                    <div class="h-px flex-grow bg-gray-100"></div>
                                    <span class="text-[10px] font-black text-gray-300 uppercase tracking-widest">OU</span>
                                    <div class="h-px flex-grow bg-gray-100"></div>
                                </div>

                                <!-- Stripe Donation -->
                                <form action="/donate/stripe" method="POST">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input type="hidden" name="actionId" th:value="${action.id}" />
                                    <input type="hidden" name="amount" id="stripe_hidden_amount" value="50" />
                                    
                                    <button type="submit" class="w-full py-5 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black transition-all transform hover:-translate-y-1 active:scale-95 shadow-xl shadow-blue-200 flex items-center justify-center gap-3">
                                        <i class="fa-brands fa-stripe text-2xl"></i> Payer par Carte
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- Organization Card -->
                        <div class="bg-white p-8 rounded-[2.5rem] border border-gray-100 shadow-xl">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-6">Organisé par</h4>
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-500 overflow-hidden border-2 border-white shadow-sm">
                                    <i class="fa-solid fa-building-ngo text-2xl"></i>
                                </div>
                                <div>
                                    <p class="font-black text-gray-900">Hope Foundation</p>
                                    <p class="text-xs font-bold text-emerald-500 flex items-center gap-1">
                                        <i class="fa-solid fa-circle-check"></i> Partenaire Vérifié
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
