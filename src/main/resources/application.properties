spring.application.name=renko
server.port=8087

# H2 Database (Persistent)
spring.datasource.url=jdbc:h2:file:./data/renko_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=kirito
spring.datasource.password=kirito123

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Show SQL (optionnel)
spring.jpa.show-sql=true

# MongoDB Local (for development)
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/charity_app

# Thymeleaf caching
spring.thymeleaf.cache=false

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Email Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=admin@renko.com
spring.mail.password=admin
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


